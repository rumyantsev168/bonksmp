    <style>
        main > div#upd-cont {
            display: grid;
            grid-template-columns: repeat(2, 600px);
        }

            padding: 10px;
            text-align: left;
            border: 2px solid black;

            flex-direction: column-reverse;

            margin: 0px;
        }

        main > div#recipes {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        main > div#recipes > item-slot-grid {
