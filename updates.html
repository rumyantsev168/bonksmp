<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/favicon.png">
    <link rel="stylesheet" href="css/style.css">
    <style>
        main > div#upd-cont {
            display: grid;
            grid-template-columns: repeat(2, 600px);
        }

        main > div#upd-cont > div {
            padding: 10px;
            text-align: left;
            border: 2px solid black;
        }

        main > div#upd-cont > div > div {
            display: flex;
            flex-direction: column-reverse;
            gap: 5px;
        }

        main > div#upd-cont > div > div > p {
            margin: 0px;
        }

        main > div#recipes {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        main > div#recipes > item-slot-grid {
            justify-self: center;
        }
    </style>
    <title>bonksmp | updates</title>
</head>
<body>
    <!--updates are stored in data/server_updates.yml and data/site_updates.yml-->
    <main>
        <div id="upd-cont">
            <div>
                <h3 style="text-align: center; margin: 0px 0px 10px;">server:</h3>
                <div id="server-updates"></div>
            </div>
            <div>
                <h3 style="text-align: center; margin: 0px 0px 10px;">website:</h3>
                <div id="site-updates"></div>
            </div>
        </div>
        <h3>mace and wind charge recipes!!</h3>
        <!--bonk don't touch this code pls-->
        <!--bonk: the recipe updated not too long ago, had to change it-->
        <!--btw, pls make the tooltips go on top-->
        <div id="recipes">
            <item-slot-grid json="data/recipes/heavy_core.json"></item-slot-grid>
            <item-slot-grid json="data/recipes/breeze_rod.json"></item-slot-grid>
            <item-slot-grid json="data/recipes/mace.json"></item-slot-grid>
            <item-slot-grid json="data/recipes/wind_charge.json"></item-slot-grid>
        </div>
    </main>
    <script src="js/min/js-yaml.min.js"></script>
    <script src="js/navigation.js"></script>
    <script src="https://rumyantsev168.github.io/static/js/minecraft/ItemSlot.js"></script>
    <script src="js/updatesYAML.js"></script>
</body>
</html>
