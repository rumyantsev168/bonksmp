    <script>
        // Get data/ALERT.txt and do alert() if that file is not empty
        // and was last modified less than X days ago
        let alertFile = "data/ALERT.txt";
        let daysAgo = 5;

        function fetchAlert() {
            let isAlerted = sessionStorage.getItem("isAlerted");
            if (isAlerted !== "true") {
                try {
                    let req = new XMLHttpRequest();
                    req.open("HEAD", alertFile, false);
                    req.send(null);
                    if (req.status != 200) return;
                    let lastMod = req.getResponseHeader("Last-Modified");
                    if (Math.floor(Math.abs(new Date() - new Date(lastMod)) / (1000 * 60 * 60 * 24)) > daysAgo) return;
                    fetch("data/ALERT.txt")
                    .then(obj => obj.text())
                    .then(data => {
                        if (data) {
                            alert(data);
                        };
                    });
                    sessionStorage.setItem("isAlerted", "true");
                } catch(err) {
                    console.error(`Failed to fetch ${alertFile}!`, err);
                    return;
                };
            };
        };

        fetchAlert();
    </script>
